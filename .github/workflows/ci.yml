name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must satisfy the pins in requirements.txt (numpy 2.5 needs >=3.12);
          # matches the 3.14 venv used for local development.
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests
        run: pytest -q
